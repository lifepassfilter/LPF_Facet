name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a build still running for the same branch
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFACET_BUILD_TESTS=ON "$EXTRA"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          set -e
          OUT=LPF-Facet-${{ matrix.name }}
          mkdir -p "$OUT"
          for P in "LPF_Facet:Facet"; do
            TARGET="${P%%:*}"; NAME="${P#*:}"
            ART="build/${TARGET}_artefacts/Release"
            cp -R "$ART/VST3/$NAME.vst3" "$OUT/"
            if [ -d "$ART/AU/$NAME.component" ]; then cp -R "$ART/AU/$NAME.component" "$OUT/"; fi
            if [ -d "$ART/Standalone/$NAME.app" ]; then cp -R "$ART/Standalone/$NAME.app" "$OUT/";
            elif [ -f "$ART/Standalone/$NAME.exe" ]; then cp "$ART/Standalone/$NAME.exe" "$OUT/"; fi
          done
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "$OUT/"
          cp -R licenses "$OUT/"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "$OUT.zip" "$OUT" > /dev/null; else zip -qry "$OUT.zip" "$OUT"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LPF-Facet-${{ matrix.name }}
          path: LPF-Facet-${{ matrix.name }}.zip

  # One release per version: the tag v<version> (read from CMakeLists.txt) is created here,
  # so a push to main is enough to publish.
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version
        id: ver
        run: |
          V=$(sed -n 's/^project(LPF_Facet VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version $V"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum *.zip | tee SHA256SUMS.txt

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.zip

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Facet v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Facet by Life Pass Filter, listed in your host as "Facet (Life Pass Filter)".
            One plugin with Audio, MIDI and Both modes; output from stereo to 16 channels (rings, Ambisonics, 5.1 to 9.1.6, head stems).
            Windows: VST3 + Standalone. macOS (Apple Silicon + Intel): VST3, AU + Standalone.
            Unsigned binaries: see "Install" in the README (macOS quarantine, Windows unblock).
            Verify a download: gh attestation verify <file>.zip -R lifepassfilter/LPF_Facet (checksums in SHA256SUMS.txt).
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
